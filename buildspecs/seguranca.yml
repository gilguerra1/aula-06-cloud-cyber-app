# Fitness functions de segurança: segredos, dependências e código.
# Projeto CodeBuild: notas-seguranca.
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
      # Ferramentas de dependências (SCA) e de código (SAST).
      - pip install --quiet pip-audit bandit
  build:
    commands:
      # O gitleaks precisa do histórico completo do Git (opção "Full clone" na origem do pipeline).
      - git config --global --add safe.directory "$CODEBUILD_SRC_DIR"
      - git fetch --unshallow --quiet || true
      - gitleaks git . --redact --verbose
      # pip-audit: falha (código de saída 1) se alguma dependência tiver vulnerabilidade conhecida.
      - pip-audit -r requirements.txt
      # Bandit: código da aplicação, fora de tests/ e scripts/, só severidade média ou alta (-ll).
      - bandit -r . -x ./tests,./scripts -ll