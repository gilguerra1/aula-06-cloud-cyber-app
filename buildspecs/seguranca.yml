# Fitness functions de segurança: segredos, dependências e código.
# Projeto CodeBuild: notas-seguranca.
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
      # Ferramentas de dependências (SCA) e de código (SAST).
      - pip install --quiet pip-audit bandit
  build:
    commands:
      # O gitleaks precisa do histórico completo do Git (opção "Full clone" na origem do pipeline).
      - git config --global --add safe.directory "$CODEBUILD_SRC_DIR"
      # Trava: sem o .git, o gitleaks varre 0 commits e PASSA em silêncio. Aqui o build falha de propósito.
      - git rev-parse --is-inside-work-tree || { echo "ERRO - a origem do pipeline nao esta como Clone completo (Full clone)"; exit 1; }
      - git fetch --unshallow --quiet || true
      - gitleaks git . --redact --verbose
      # pip-audit e Bandit rodam SEMPRE os dois, para todos os achados aparecerem no mesmo log.
      # O build só falha no final, se algum dos dois encontrou problema.
      - |
        FALHA=0
        echo "===== pip-audit (SCA) ====="
        pip-audit -r requirements.txt || FALHA=1
        echo "===== Bandit (SAST) ====="
        bandit -r . -x ./tests,./scripts -ll || FALHA=1
        test "$FALHA" -eq 0